name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: bash -n mcx
      - run: python3 -m unittest discover -s tests -v

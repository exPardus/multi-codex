  <circle cx="718" cy="87" r="3" fill="#66809c"/>
  <circle cx="730" cy="87" r="3" fill="#66809c"/>
  <circle cx="742" cy="87" r="3" fill="#66809c"/>
  <text x="718" y="113" fill="#d6e8fa" font-family="monospace" font-size="16"><tspan fill="#76e3d7">$ </tspan>mcx spawn "a focused task"</text>
  <g font-family="monospace">

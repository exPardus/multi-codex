<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">multi-codex — One shell. Independent workers.</title>
  <desc id="desc">A dark navy banner with the multi-codex wordmark and a diagram connecting a shell command to three independent Codex workers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101d35"/><stop offset="1" stop-color="#080f1c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#76e3d7"/><stop offset="1" stop-color="#90baff"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#9fb8d9" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="418" rx="19" fill="none" stroke="#263753"/>

  <text x="92" y="57" fill="#a9bad1" font-family="sans-serif" font-size="13" letter-spacing="3">EXPARDUS / DEVELOPER TOOLS</text>
  <text x="55" y="164" fill="#f0f5fd" font-family="sans-serif" font-size="70" font-weight="700" letter-spacing="-3">multi<tspan fill="url(#accent)">-codex</tspan></text>
  <text x="58" y="208" fill="#c4d1e4" font-family="sans-serif" font-size="23">One shell. Independent workers.</text>
  <text x="58" y="246" fill="#91a4bf" font-family="sans-serif" font-size="17">Send a task. Get an ID. Keep moving.</text>
